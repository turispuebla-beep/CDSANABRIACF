<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha jugador/a — Torneo — CD Sanabria CF</title>
    <style>
        :root { --primary: #1e3a8a; --bg: #f1f5f9; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: #1e293b; line-height: 1.5; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
        .card { background: #fff; border-radius: 14px; padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
        h1 { color: var(--primary); font-size: 1.35rem; margin: 0 0 8px; }
        .sub { color: #64748b; font-size: 0.92rem; margin: 0 0 16px; }
        h2 { font-size: 1rem; color: var(--primary); margin: 18px 0 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
        label { display: block; font-weight: 600; font-size: 0.86rem; margin: 10px 0 4px; }
        input, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 4px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
        .check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; margin: 12px 0; font-weight: normal; }
        .check input { width: auto; margin-top: 4px; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 999px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #1e3a8a, #2563eb); cursor: pointer; margin-top: 12px; }
        .btn:disabled { opacity: 0.6; cursor: wait; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px; border-radius: 10px; font-size: 0.9rem; }
        .ok { background: #ecfdf5; border: 1px solid #86efac; color: #065f46; padding: 16px; border-radius: 10px; }
        .guardian { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 14px; margin-top: 8px; }
        .doc-legal { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; color: #475569; line-height: 1.45; margin: 12px 0; }
        .doc-upload input[type="file"] { font-size: 0.88rem; padding: 8px 0; }
        .age-hint { font-size: 0.88rem; color: #1e40af; margin: -2px 0 8px; font-weight: 600; }
        a { color: var(--primary); }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <p><a href="index.html">← Web del club</a></p>

        <div id="tjLoading" class="card"><p class="sub" style="margin:0;">Cargando ficha…</p></div>
        <div id="tjErrorMain" class="error" hidden></div>

        <div id="tjFormWrap" class="card" hidden>
            <h1>Ficha de jugador/a</h1>
            <p class="sub"><strong id="tjTeamName">Equipo</strong> · <span id="tjEventName">Torneo</span><br>Categoría: <span id="tjCategories">—</span></p>
            <form id="tjForm">
                <h2>Datos del jugador/a</h2>
                <div class="grid2">
                    <div><label for="tjName">Nombre *</label><input type="text" id="tjName" required autocomplete="given-name"></div>
                    <div><label for="tjSurname">Apellidos *</label><input type="text" id="tjSurname" required autocomplete="family-name"></div>
                </div>
                <label for="tjDniType">Tipo de documento *</label>
                <select id="tjDniType" required>
                    <option value="espanol">DNI español</option>
                    <option value="extranjero">Documento extranjero / NIE / pasaporte</option>
                </select>
                <label for="tjDni">Número de documento *</label>
                <input type="text" id="tjDni" required autocomplete="off">
                <label for="tjBirth">Fecha de nacimiento *</label>
                <input type="date" id="tjBirth" required>
                <p id="tjAgeHint" class="age-hint" hidden></p>
                <div class="grid2">
                    <div><label for="tjEmail">Email</label><input type="email" id="tjEmail" autocomplete="email"></div>
                    <div><label for="tjPhone">Teléfono</label><input type="tel" id="tjPhone" autocomplete="tel"></div>
                </div>

                <div id="tjGuardianBlock" class="guardian" hidden>
                    <h2 style="margin-top:0;border:none;padding:0;">Tutor/a legal (menor de 18 años) *</h2>
                    <div class="grid2">
                        <div><label for="tjGuardianName">Nombre tutor/a *</label><input type="text" id="tjGuardianName"></div>
                        <div><label for="tjGuardianSurname">Apellidos tutor/a *</label><input type="text" id="tjGuardianSurname"></div>
                    </div>
                    <label for="tjGuardianDniType">Tipo documento tutor/a *</label>
                    <select id="tjGuardianDniType">
                        <option value="espanol">DNI español</option>
                        <option value="extranjero">Documento extranjero</option>
                    </select>
                    <label for="tjGuardianDni">Documento tutor/a *</label>
                    <input type="text" id="tjGuardianDni">
                    <div class="grid2">
                        <div><label for="tjGuardianPhone">Teléfono tutor/a *</label><input type="tel" id="tjGuardianPhone"></div>
                        <div><label for="tjGuardianEmail">Email tutor/a</label><input type="email" id="tjGuardianEmail"></div>
                    </div>
                </div>

                <h2>Documentación acreditativa *</h2>
                <p class="doc-legal" id="tjDocLegal"></p>
                <div class="doc-upload">
                    <label for="tjDocAnverso">DNI — anverso (o documento válido) *</label>
                    <input type="file" id="tjDocAnverso" accept="image/jpeg,image/png,image/webp,application/pdf" required>
                    <label for="tjDocReverso">DNI — reverso (recomendado)</label>
                    <input type="file" id="tjDocReverso" accept="image/jpeg,image/png,image/webp,application/pdf">
                    <label for="tjDocOtro">Otro documento acreditativo (opcional)</label>
                    <input type="file" id="tjDocOtro" accept="image/jpeg,image/png,image/webp,application/pdf">
                </div>

                <h2>Consentimientos</h2>
                <label class="check"><input type="checkbox" id="tjClubRules" required> Acepto las normas del torneo y del club, y el tratamiento de mis datos para la organización del evento. *</label>
                <label class="check"><input type="checkbox" id="tjPhotoConsent" required> Autorizo (o el tutor/a autoriza) el uso de imagen del jugador/a en fotos y vídeos del torneo y actividades del club. *</label>

                <div id="tjError" class="error" hidden style="margin-top:12px;"></div>
                <button type="submit" class="btn" id="tjSubmitBtn">Enviar ficha</button>
            </form>
        </div>

        <div id="tjDone" class="card ok" hidden>
            <h1 style="color:#065f46;margin-top:0;">✅ Ficha enviada</h1>
            <p id="tjDoneText" style="margin:0;"></p>
        </div>
    </div>
    <script src="js/torneo-document-upload.js"></script>
    <script src="js/torneo-jugador-ficha-ui.js"></script>
</body>
</html>
