<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de asistencia — CD Sanabria CF</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #7f1d1d 0%, #1e293b 55%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 18px;
            padding: 22px 20px 18px;
            box-shadow: 0 18px 40px rgba(0,0,0,.35);
            backdrop-filter: blur(8px);
        }
        .badge {
            display: inline-block;
            background: #dc2626;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .badge.honor { background: linear-gradient(90deg, #b45309, #f59e0b); color: #1c1917; }
        .badge.jugador { background: #1d4ed8; }
        h1 {
            margin: 0 0 6px;
            font-size: 1.15rem;
            line-height: 1.25;
        }
        .sub {
            margin: 0 0 18px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,.12);
            font-size: 0.95rem;
        }
        .row span:first-child { color: #94a3b8; }
        .row strong { text-align: right; word-break: break-word; }
        .ok {
            margin-top: 16px;
            background: rgba(16,185,129,.18);
            border: 1px solid rgba(16,185,129,.45);
            color: #a7f3d0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-weight: 700;
        }
        .err {
            background: rgba(239,68,68,.16);
            border: 1px solid rgba(248,113,113,.45);
            color: #fecaca;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            line-height: 1.45;
        }
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
        }
        a { color: #fca5a5; }
        .demo-btn {
            display: inline-block;
            margin-top: 12px;
            background: #dc2626;
            color: #fff !important;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card" id="box">
        <div class="err">Leyendo QR…</div>
    </div>
    <script>
        (function () {
            function fromBase64Url(s) {
                try {
                    var b64 = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
                    while (b64.length % 4) b64 += '=';
                    return decodeURIComponent(escape(atob(b64)));
                } catch (e) {
                    return '';
                }
            }

            function escapeHtml(v) {
                return String(v == null ? '' : v)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function tipoClass(tipo) {
                if (tipo === 'honorifico') return 'honor';
                if (tipo === 'jugador') return 'jugador';
                return '';
            }

            function tipoLabel(data) {
                if (data.tipoLabel) return data.tipoLabel;
                if (data.tipo === 'honorifico') return 'Socio de honor';
                if (data.tipo === 'jugador') return 'Socio-jugador';
                return 'Socio/a';
            }

            function renderOk(data) {
                var now = new Date();
                var when = now.toLocaleString('es-ES', { timeZone: 'Europe/Madrid' });
                box.innerHTML =
                    '<div class="badge ' + tipoClass(data.tipo) + '">' + escapeHtml(tipoLabel(data)) + '</div>' +
                    '<h1>' + escapeHtml(data.nombre) + '</h1>' +
                    '<p class="sub">' + escapeHtml(data.club || 'CD Sanabria CF') + ' · control de asistencia</p>' +
                    '<div class="row"><span>DNI / NIF</span><strong>' + escapeHtml(data.dni || '—') + '</strong></div>' +
                    '<div class="row"><span>N.º socio</span><strong>' + escapeHtml(data.num || '—') + '</strong></div>' +
                    '<div class="row"><span>Temporada</span><strong>' + escapeHtml(data.temp || '—') + '</strong></div>' +
                    '<div class="row"><span>Leído</span><strong>' + escapeHtml(when) + '</strong></div>' +
                    '<div class="ok">✅ Socio identificado</div>' +
                    '<div class="footer"><a href="index.html">cdsanabriacf.com</a></div>';
            }

            var params = new URLSearchParams(location.search);
            // También aceptar datos en el hash (#nombre=...)
            if ((!params.get('nombre') && !params.get('p')) && location.hash && location.hash.length > 1) {
                params = new URLSearchParams(location.hash.replace(/^#/, ''));
            }

            var box = document.getElementById('box');
            var data = null;

            // Formato nuevo: parámetros sueltos (fiable al escanear)
            if (params.get('nombre') || params.get('dni') || params.get('num')) {
                data = {
                    nombre: params.get('nombre') || '—',
                    dni: params.get('dni') || '—',
                    num: params.get('num') || '—',
                    tipo: params.get('tipo') || 'socio',
                    temp: params.get('temp') || '—',
                    id: params.get('id') || '',
                    club: 'CD Sanabria CF'
                };
                if (!params.get('nombre') && params.get('dni')) {
                    data.nombre = 'DNI ' + params.get('dni');
                }
            }

            // Formato antiguo: ?p=base64
            if (!data) {
                var raw = params.get('p') || params.get('d') || '';
                if (raw) {
                    var json = fromBase64Url(raw);
                    try { data = JSON.parse(json); } catch (e) { data = null; }
                }
            }

            // Demo local
            if (!data && (params.get('demo') === '1' || params.get('ejemplo') === '1')) {
                data = {
                    nombre: 'D. Ejemplo Socio Jugador',
                    dni: '12345678A',
                    num: '000063',
                    tipo: 'jugador',
                    temp: '2026-2027',
                    club: 'CD Sanabria CF'
                };
            }

            if (!data || !data.nombre) {
                box.innerHTML =
                    '<div class="err">' +
                    '<strong>Faltan datos del socio</strong><br><br>' +
                    'Esta página se abre al <strong>escanear el QR del carnet</strong>.<br>' +
                    'Si la abres sola (sin QR), no hay datos que mostrar.<br><br>' +
                    'Prueba el ejemplo:' +
                    '<br><a class="demo-btn" href="carnet-asistencia.html?demo=1">Ver ejemplo de verificación</a>' +
                    '</div>' +
                    '<div class="footer"><a href="preview-carnet-socio.html">Volver a vista previa del carnet</a></div>';
                return;
            }

            renderOk(data);
        })();
    </script>
</body>
</html>
