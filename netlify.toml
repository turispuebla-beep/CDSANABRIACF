[build]
  publish = "netlify-dist"
  functions = "netlify/functions"
  command = "npm install && powershell -NoProfile -ExecutionPolicy Bypass -File ./build-netlify-dist.ps1"

[build.environment]
  NODE_VERSION = "18"
  # Firebase Web API key es pública por diseño; evitar falso positivo del escáner en build.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  # Temporada de socios (cierre 31/05, plazo offline 7 días)
  MEMBERSHIP_SEASON_CLOSE_MONTH = "5"
  MEMBERSHIP_SEASON_CLOSE_DAY = "31"
  MEMBERSHIP_PAYMENT_DEADLINE_DAYS = "7"
  MEMBERSHIP_SEASON_FIRST_CLOSE_YEAR = "2027"
  CLUB_EMAIL_ONLY = "true"
  # Opcional: Bearer para pruebas manuales de member-season-renewal (el cron usa cabecera Netlify)
  # NETLIFY_CRON_SECRET = "..."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Renovación automática de socios activos tras el cierre de temporada (31/05)
[functions."member-season-renewal"]
  schedule = "0 6 * * *"
